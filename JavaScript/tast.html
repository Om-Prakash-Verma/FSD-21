<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <style>
        .Card {
            width: 300px;
            height: 300px;
            background-color: aqua;
        }

        .Total {
            width: 300px;
            height: 30px;
            background-color: rgb(204, 170, 170);
        }
    </style>
</head>

<body>

    <script>
        const shop = {
            tea: 100,
            coffee: 500,
            aata: 600,
            chini: 800,
        }
    </script>

    <div class="Card">
        <script>
            for (let x in shop) {
                document.write(x + "-" + shop[x] + "<br>")
            }

            function BuyMe() {
                let product = prompt("Enter Your Product")
                let quantity = prompt("Enter the quantity")

                let total = shop[product] * quantity

                document.getElementById("total").innerHTML = "Total: " + total
            }
        </script>

        <button onclick="BuyMe()">Buy Me</button>
    </div>

    <div class="Total" id="total">
        Total: 0
    </div>

</body>
</html>
