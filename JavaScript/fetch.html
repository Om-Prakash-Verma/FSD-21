
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>

    <style>
        #data {
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .card img {
            width: 150px;
            height: 150px;
        }

        .card h2 {
            font-size: 20px;
        }

        .card p {
            font-size: 16px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div id="data"></div>

    <script>
        const ele = document.getElementById("data");
        const url = "https://dummyjson.com/products";

        async function loadProduct() {
            try {
                const res = await fetch(url);
                const data = await res.json();

                let row = "";

                data.products.map((item, index) => {

                    row += `
                        <div class="card">

                            <img src="${item.images[0]}">

                            <h2>${item.title}</h2>

                            <p>Category: ${item.category}</p>

                            <p class="price">$${item.price}</p>

                        </div>
                    `;
                });

                ele.innerHTML = row;
            }

            catch (error) {
                console.log(error);
            }
        }

        loadProduct();
    </script>

</body>

</html>
