<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Numbers Square</title>
</head>
<body>

<script>
    const num = [11, 22, 32, 41, 51, 61, 71, 81, 91];

    const even = num.filter(value => value % 2 === 0);
    const square = even.map(value => value * value);
    const sum = square.reduce((accumulator, currentValue) => accumulator + currentValue);

    console.log("Even numbers =", even);
    console.log("Squares =", square);
    console.log("Sum =", sum);
</script>

</body>
</html>
